name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1 # released 2026-07-20

      # @stable is a moving tag, but the toolchain itself is pinned by
      # nib-rs/rust-toolchain.toml (channel 1.99.1).
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.3 # released 2026-10-20
        with:
          workspaces: nib-rs

      - name: Fetch PDFium (host)
        run: nib-rs/tools/fetch-pdfium.sh --host-only

      - name: Install qpdf + OpenSSL + Liberation fonts
        # qpdf and openssl are required oracles for the nib-sign tests.
        run: |
          sudo apt-get update && sudo apt-get install -y qpdf openssl fonts-liberation
          openssl version && qpdf --version

      - name: fmt
        working-directory: nib-rs
        run: cargo fmt --check

      - name: clippy
        working-directory: nib-rs
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        working-directory: nib-rs
        run: cargo test

      - uses: EmbarkStudios/cargo-deny-action@v2.1.1 # released 2026-07-13
        with:
          manifest-path: nib-rs/Cargo.toml
          command: check

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.2.0 # released 2026-11-04
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4.0.4 # released 2026-09-17
        with:
          packages: platforms;android-37.0 build-tools;36.0.0 ndk;29.0.14206865

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: nib-rs

      - name: cargo-ndk (cached binary)
        uses: actions/cache@v5.1.0 # released 2026-06-26
        id: cargo-ndk
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-4.1.2

      - name: Install cargo-ndk
        if: steps.cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --locked --version 4.1.2

      - uses: gradle/actions/setup-gradle@v6.4.1 # released 2026-10-28

      - name: Build
        run: ./gradlew --no-daemon ktlintCheck :nib-android:testDebugUnitTest :sample-app:testDebugUnitTest :nib-android:assembleRelease :sample-app:assembleRelease

      - name: Macrobenchmark gate unit tests
        run: python3 -m unittest discover -s macrobenchmark/tools -v

      - name: Check ELF 16 KB alignment
        run: |
          nib-rs/tools/check-elf-alignment.sh \
            nib-android/build/outputs/aar/nib-android-release.aar \
            sample-app/build/outputs/apk/release/sample-app-release.apk

      - uses: actions/upload-artifact@v7.0.2 # released 2026-10-07
        with:
          name: release-artifacts
          path: |
            nib-android/build/outputs/aar/nib-android-release.aar
            sample-app/build/outputs/apk/release/sample-app-release.apk
          retention-days: 7

  android-test:
    runs-on: ubuntu-latest
    needs: android-build
    steps:
      - uses: actions/checkout@v7.0.1

      # The emulator needs ~7 GB free for its userdata image; the runner is
      # nearly full after SDK + NDK + Rust targets, so drop unused toolchains.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platforms;android-37.0 build-tools;36.0.0 ndk;29.0.14206865

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          targets: x86_64-linux-android

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: nib-rs

      - name: cargo-ndk (cached binary)
        uses: actions/cache@v5.1.0
        id: cargo-ndk
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-4.1.2

      - name: Install cargo-ndk
        if: steps.cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --locked --version 4.1.2

      - uses: gradle/actions/setup-gradle@v6.4.1

      - name: Instrumentation tests (attempt 1)
        id: emu1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2.38.0 # released 2026-07-05
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --no-daemon :nib-android:connectedDebugAndroidTest :sample-app:connectedDebugAndroidTest -Pnib.abis=x86_64

      - name: Instrumentation tests (attempt 2)
        if: steps.emu1.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --no-daemon :nib-android:connectedDebugAndroidTest :sample-app:connectedDebugAndroidTest -Pnib.abis=x86_64

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: android-test-reports
          path: |
            nib-android/build/reports/androidTests/
            nib-android/build/outputs/androidTest-results/
            sample-app/build/reports/androidTests/
            sample-app/build/outputs/androidTest-results/
          retention-days: 7
