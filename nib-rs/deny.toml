[graph]
all-features = false

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
exceptions = [
  { name = "uniffi", allow = ["MPL-2.0"] },
  { name = "uniffi_bindgen", allow = ["MPL-2.0"] },
  { name = "uniffi_core", allow = ["MPL-2.0"] },
  { name = "uniffi_internal_macros", allow = ["MPL-2.0"] },
  { name = "uniffi_macros", allow = ["MPL-2.0"] },
  { name = "uniffi_meta", allow = ["MPL-2.0"] },
  { name = "uniffi_pipeline", allow = ["MPL-2.0"] },
  { name = "uniffi_udl", allow = ["MPL-2.0"] },
]

[advisories]
yanked = "deny"
# basic-toml is unmaintained but only reachable via uniffi_bindgen -> askama
# (bindgen-time only); no safe upgrade exists upstream. chrono (RUSTSEC-2026-0543)
# is unmaintained since 2025 but has no known vulnerabilities and is used by
# nib-core for Op timestamps; replacing it is a model/serde break.
ignore = ["RUSTSEC-2026-0374", "RUSTSEC-2026-0543"]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
