[workspace]
resolver = "2"
members = ["nib-core", "nib-render", "nib-sign", "nib-ffi", "uniffi-bindgen"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/<org>/nib-pdf"
publish = false

[workspace.dependencies]
uniffi = "0.32.2"
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_8125"] }
lopdf = { version = "0.47.0", features = ["serde"] }
thiserror = "2.0.21"
log = "0.4.35"
android_logger = "0.15.1"
proptest = "1.12.0"
criterion = "=0.7.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
image_hasher = "3.1.1"
tiny-skia = "0.12.0"
swash = "0.2.10"
futures-channel = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
uuid = { version = "1.29.0", features = ["v4", "v5", "v7", "serde"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
schemars = { version = "1.2.3", features = ["derive", "uuid1", "chrono04", "preserve_order"] }
kurbo = "0.13.1"
skrifa = "=0.44.0"
subsetter = { version = "=0.2.6", default-features = false }
base64 = "0.22.1"
tempfile = "3.27.0"
sha2 = "0.11.1"
insta = { version = "1.49.0", features = ["json"] }
jsonschema = { version = "0.60.2", default-features = false }
# M5 PDF/CMS signing (typed CMS only: no `cms/builder`, so no RSA decryption code
# path is pulled in by `cms`; `rsa` 0.10.0 is patched for RUSTSEC-2023-0071).
cms = { version = "=0.3.0-rc.2", default-features = false, features = ["std"] }
x509-cert = { version = "=0.3.0", default-features = false, features = ["std"] }
der = { version = "=0.8.3", features = ["derive", "oid", "std"] }
spki = { version = "=0.8.1", features = ["std"] }
const-oid = { version = "=0.10.3", features = ["db"] }
rsa = { version = "=0.10.0", default-features = false, features = ["std", "encoding", "pkcs1v15"] }
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "pkcs8", "alloc"] }
p384 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "pkcs8", "alloc"] }
signature = { version = "=3.0.0", features = ["alloc"] }
getrandom = { version = "=0.4.3", features = ["sys_rng"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

# Test-time RSA key generation and verification are impractically slow
# unoptimised; these only affect dev/test builds.
[profile.dev.package.crypto-bigint]
opt-level = 3

[profile.dev.package.crypto-primes]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3
