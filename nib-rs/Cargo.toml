[workspace]
resolver = "2"
members = ["nib-core", "nib-render", "nib-sign", "nib-ffi", "uniffi-bindgen"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/<org>/nib-pdf"
publish = false

[workspace.dependencies]
uniffi = "0.32.2"
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_8125"] }
lopdf = { version = "0.47.0", features = ["serde"] }
thiserror = "2.0.21"
log = "0.4.35"
android_logger = "0.15.1"
proptest = "1.12.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
image_hasher = "3.1.1"
futures-channel = "0.3.34"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"
